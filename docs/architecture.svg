<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">AI-Powered Employee Helpdesk – Architecture</text>

  <!-- Users -->
  <rect x="30" y="70" width="170" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="115" y="96" text-anchor="middle" font-weight="600">Employee</text>
  <text x="115" y="116" text-anchor="middle" fill="#4b5563" font-size="12">raise / track tickets</text>
  <rect x="30" y="280" width="170" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="115" y="306" text-anchor="middle" font-weight="600">Support staff</text>
  <text x="115" y="326" text-anchor="middle" fill="#4b5563" font-size="12">work queue, triage</text>

  <!-- React -->
  <rect x="250" y="140" width="170" height="130" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="335" y="170" text-anchor="middle" font-weight="600">React (Vite)</text>
  <text x="335" y="192" text-anchor="middle" font-size="12">:5173</text>
  <text x="335" y="216" text-anchor="middle" font-size="12">Employee pages</text>
  <text x="335" y="234" text-anchor="middle" font-size="12">Support pages</text>
  <text x="335" y="252" text-anchor="middle" font-size="12">AIPanel + Feedback</text>

  <!-- FastAPI -->
  <rect x="480" y="120" width="190" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="150" text-anchor="middle" font-weight="600">FastAPI backend</text>
  <text x="575" y="170" text-anchor="middle" font-size="12">:8000</text>
  <text x="575" y="196" text-anchor="middle" font-size="12">/api/tickets (CRUD, status,</text>
  <text x="575" y="212" text-anchor="middle" font-size="12">comments, history)</text>
  <text x="575" y="234" text-anchor="middle" font-size="12">/api/summary</text>
  <text x="575" y="256" text-anchor="middle" font-size="12">/api/tickets/{id}/ai/*</text>
  <text x="575" y="276" text-anchor="middle" font-size="11" fill="#4b5563">prompt guard · validation</text>

  <!-- Postgres -->
  <rect x="720" y="70" width="160" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="800" y="98" text-anchor="middle" font-weight="600">PostgreSQL</text>
  <text x="800" y="120" text-anchor="middle" font-size="12">requesters, tickets,</text>
  <text x="800" y="136" text-anchor="middle" font-size="12">ticket_activity,</text>
  <text x="800" y="152" text-anchor="middle" font-size="12">ai_suggestions,</text>
  <text x="800" y="168" text-anchor="middle" font-size="12">ai_feedback</text>

  <!-- Ollama -->
  <rect x="720" y="240" width="160" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="268" text-anchor="middle" font-weight="600">Ollama (local)</text>
  <text x="800" y="290" text-anchor="middle" font-size="12">qwen2.5:3b</text>
  <text x="800" y="308" text-anchor="middle" font-size="12">:11434 /api/chat</text>

  <!-- Arrows -->
  <line x1="200" y1="100" x2="270" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="310" x2="270" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="205" x2="478" y2="205" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="449" y="196" text-anchor="middle" font-size="11">HTTP/JSON</text>
  <line x1="670" y1="170" x2="718" y2="135" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="140" text-anchor="middle" font-size="11">SQLAlchemy</text>
  <line x1="670" y1="250" x2="718" y2="280" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="694" y="300" text-anchor="middle" font-size="11">httpx</text>

  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#4b5563">AI output is advisory: stored in ai_suggestions, applied to the ticket only after staff accept or correct it.</text>
  <text x="450" y="400" text-anchor="middle" font-size="12" fill="#4b5563">If Ollama is down the API returns 503 for AI calls only; tickets keep working.</text>
</svg>
